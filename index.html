 <button class="btn" onClick=${()=>dl(modal.n,modal.x,modal.ty)}>تنزيل</button><button class="btn" onClick=${()=>setModal(null)}>إغلاق</button></div><//>`}
 ${modal&&modal.k==='imp'&&h`<${Modal} close=${()=>setModal(null)}><h3>استعادة نسخة JSON</h3><textarea placeholder="الصق محتوى النسخة هنا" value=${imp} onInput=${e=>setImp(e.target.value)}></textarea><input type="file" accept=".json" onChange=${e=>{const r=new FileReader();r.onload=()=>setImp(String(r.result));e.target.files[0]&&r.readAsText(e.target.files[0])}}/>
 <div class="row" style=${{marginTop:8}}><button class="btn p" onClick=${()=>{try{const j=JSON.parse(imp);if(!j.tasks||!j.bath)throw 0;setModal(null);setCf({msg:'سيتم استبدال كل البيانات الحالية بالنسخة. متابعة؟',fn:()=>{setS({...mk(),...j});say('تمت الاستعادة')}})}catch(e){say('ملف غير صالح')}}}>استعادة</button><button class="btn" onClick=${()=>setModal(null)}>إلغاء</button></div><//>`}
 ${cf&&h`<${Modal} close=${()=>setCf(null)}><h3>تأكيد</h3><p>${cf.msg}</p><div class="row"><button class="btn d" onClick=${()=>{cf.fn();setCf(null)}}>نعم، تأكيد</button><button class="btn" onClick=${()=>setCf(null)}>إلغاء</button></div><//>`}
 ${ts&&h`<div class="toast">${ts}</div>`}`}
ReactDOM.createRoot(document.getElementById('root')).render(h`<${App}/>`);
</script></body></html>
